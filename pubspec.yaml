name: pos_app
description: "POS Application with ABC Optimization & YOLOv8 CCTV Analytics"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management & DI
  mobx: ^2.6.1
  flutter_mobx: ^2.3.0
  get_it: ^7.6.7

  # Networking & Functional Programming
  dio: ^5.11.1
  dartz: ^0.10.1

  # UI & Visualizations
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  mobx_codegen: ^2.6.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
